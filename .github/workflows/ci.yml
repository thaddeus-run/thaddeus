# The `CI passed` job at the end is adapted from the `Check` job in
# pingdotgg/t3code at 2fae0f9.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # moon detects CI and compares against the pull request's base
          # branch on every run, so the checkout needs full history and refs.
          fetch-depth: 0

      # proto installs the pinned bun/node/moon/gh from .prototools.
      - name: Install proto toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: |
          # bunfig's minimumReleaseAge is a dev-machine supply-chain gate.
          # Against a frozen, reviewed lockfile it only risks blocking freshly
          # published pinned tool versions and producing a partial install on
          # the clean CI runner, so disable it for CI (GNU sed on the runner).
          sed -i 's/^minimumReleaseAge = .*/minimumReleaseAge = 0/' bunfig.toml
          bun install --frozen-lockfile

      # Typecheck and test every project. Each task builds the workspace
      # packages it imports first, so this also builds them all.
      #
      # landing:typecheck is left out on purpose. It fails on a clean checkout
      # with `Cannot find module './routeTree.gen'` because that file is
      # gitignored and only `vite dev` or `vite build` generates it, and the
      # typecheck task does not depend on either. Drop the --query once
      # landing:typecheck can run from a clean checkout.
      - name: Typecheck and test every project
        run: |
          export AGENT=1
          moon run :test
          moon run :typecheck --query 'projectSource!=apps/landing'

      # Runs after the builds above on purpose: type-aware lint resolves
      # @thaddeus.run/* imports through each package's built dist, and on a
      # clean checkout it reports false errors if the dist folders are missing.
      - name: Check formatting and lint
        run: moon run root:format-check root:lint

      # The release-version checks, then the executable demo. example-cli:test
      # is runInCI: skip, so the CI= prefix clears the marker for that one task.
      - name: Verify DX versions and the executable demo
        run: |
          export AGENT=1
          moon run root:version-check root:version-test
          make demo
          make demo
          CI= moon run example-cli:test

  # The lazythad TUI (lazythad/) is a standalone Rust crate outside the moon/bun
  # graph, so it gets its own job: format, lint, and test with the toolchain
  # pinned in .prototools.
  lazythad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95.0
        # Pinned to a commit SHA (dtolnay/rust-toolchain has no release tags), the
        # same supply-chain guarantee as the other actions' version tags.
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lazythad
      - name: Format
        run: cargo fmt --manifest-path lazythad/Cargo.toml --check
      - name: Lint
        run:
          cargo clippy --manifest-path lazythad/Cargo.toml --all-targets -- -D
          warnings
      - name: Test
        run: cargo test --manifest-path lazythad/Cargo.toml

  # Times the everyday commands (status, diff, push, workspace, pull and a cold
  # clone) on this runner against git, on small-serial: the cases
  # bench/budgets/everyday.json names, warm and with the page cache dropped.
  # It fails when a thaddeus p50 is above the ceiling that
  # bench/budgets/ceilings-github-ubuntu-latest.json records for it, when a
  # gated case no longer finishes ok, or when that file is missing or was
  # calibrated for other case versions or page-cache modes. A missed target
  # and the multiple of git are in the job summary and never fail the job:
  # today's numbers miss most targets, and a gate that is red on every PR
  # would only get switched off. After changing a gated case, or when the
  # runner image shifts, dispatch the Benchmarks workflow with
  # `mode: everyday-calibrate` and commit the `everyday-ceilings` artifact
  # over that file. The dropped-cache modes drop the page cache with
  # `sudo -n`, which hosted runners allow.
  everyday-gate:
    name: Everyday-command latency gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # moon detects CI and compares against the pull request's base
          # branch on every run, so the checkout needs full history and refs.
          fetch-depth: 0

      - name: Install proto toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install dependencies
        run: |
          # See the check job: minimumReleaseAge is a dev-machine gate.
          sed -i 's/^minimumReleaseAge = .*/minimumReleaseAge = 0/' bunfig.toml
          bun install --frozen-lockfile

      # The e2e cases drive the compiled binary. cli:compile is runInCI: skip,
      # so the CI= prefix clears the marker for that one task.
      - name: Build bench's packages and the CLI binary
        run: |
          moon run bench:build-deps
          CI= moon run cli:compile

      - name: Time the everyday commands against git
        run: |
          export AGENT=1
          cd bench
          bun src/cli.ts gate-run --out out/gate.json

      - name: Report against the budgets
        run: |
          export AGENT=1
          cd bench
          bun src/cli.ts budget out/gate.json

      - name: Gate on the calibrated ceilings
        run: |
          export AGENT=1
          cd bench
          bun src/cli.ts gate out/gate.json

      - name: Upload the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: everyday-gate
          path: bench/out/
          if-no-files-found: ignore

  # Branch protection requires this job by its name, `CI passed`. It fails when
  # any job it needs fails, is cancelled or is skipped, so splitting or
  # renaming jobs needs no ruleset change. Add every new job to `needs`.
  # `always()` rather than `!cancelled()`: a skipped job reports success to
  # branch protection, so a cancelled run must still produce a failing check.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [check, lazythad, everyday-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
