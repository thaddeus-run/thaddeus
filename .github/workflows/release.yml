name: Release

# The nightly channel is adapted from pingdotgg/t3code's release.yml and
# .github/scripts/check-nightly-release.cjs at 2fae0f9.
#
# Three channels. A tag push is release, a schedule is nightly, and a dispatch
# picks one with the channel input.
#
# release: a pushed v* tag, or a dispatch with the tag input. Cross-build the
# CLI (bun --compile, every OS/arch from one runner) and the TUI (cargo, one
# native runner per target), publish a GitHub Release with the binaries +
# checksums, then publish the npm launchers over OIDC trusted publishing to the
# version's dist-tag (alpha for 0.1.11-alpha) and move npm `latest` up to that
# version, never down.
#
# Deploy rule: only a tag push deploys ams1 (Fly app `thaddeus`), after its
# GitHub release. FLY_API_TOKEN lives in the `production` environment, which
# admits v* tag refs only, so a dispatched release (whose ref is a branch such as
# main) would be refused; the deploy job skips it, as it skips every nightly and
# dry run. Fly's own GitHub auto-deploy is off.
#
# nightly: every six hours, if main has commits after the newest release whose
# tag contains -nightly., build main as <next patch>-nightly.<UTC date>.<run>.
# set-release-version.ts rewrites the shared version in each job's checkout, so
# the same version checks hold. A nightly is a GitHub prerelease that never
# becomes "latest", and its npm launchers go to the `nightly` dist-tag; it never
# touches npm `latest`. A dispatched nightly skips the new-commits check and
# must run on main unless dry_run is set. "Re-run all jobs" and "Re-run failed
# jobs" both resume the same nightly: its tag and version stay, and the release
# and npm jobs finish what is missing.
#
# promote: a dispatch with the tag input (e.g. v0.1.10-alpha) points npm
# `latest` for both launchers at that existing release without building
# anything, and may move `latest` backwards. Only the npm-promote job runs.
#
# dry_run builds and verifies, then skips the GitHub release, npm and the
# deploy. A promote dry run checks the release and npm, then moves nothing.
on:
  push:
    # Nightly tags come from the release job below. Excluding them keeps a
    # hand-pushed nightly tag from starting a release-channel run.
    tags: ['v*', '!v*-nightly.*']
  schedule:
    # Minute 23 avoids the top of the hour, when GitHub's scheduler is busiest.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description:
          'Existing tag (e.g. v0.1.10-alpha); release and promote channels only'
        required: false
      channel:
        description:
          'release publishes the tag above; nightly builds the selected branch;
          promote points npm latest at the tag above'
        type: choice
        options: [release, nightly, promote]
        default: release
      dry_run:
        description:
          'Verify only; skip the GitHub release and npm (promote moves no tag)'
        type: boolean
        default: false

# GitHub keeps one running and one pending run per group, so the groups are as
# narrow as each case allows. A running publish is never cancelled.
#   1. Nightly dry run: release-nightly-dry-<branch>, so a branch build never
#      queues behind or cancels a scheduled nightly.
#   2. Scheduled or publishing nightly: release-nightly, so two nightlies never
#      build or publish out of order.
#   3. Release or promote channel: release-<tag> (the tag input, or the pushed
#      tag), so different tags run in parallel and two runs of one tag, such
#      as its release and a promote of it, take turns.
# On a schedule every inputs.* is empty, so case 1 is false and case 2 matches.
concurrency:
  group:
    ${{ inputs.channel == 'nightly' && inputs.dry_run == true &&
    format('release-nightly-dry-{0}', github.ref_name) || (github.event_name ==
    'schedule' || inputs.channel == 'nightly') && 'release-nightly' ||
    format('release-{0}', inputs.tag || github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    name: Verify the selected release
    # A promote builds nothing. A job whose needs were skipped is skipped too,
    # so every job below except npm-promote, which needs nothing, stays off.
    # On a push or schedule inputs.channel is empty, so preflight runs.
    if: inputs.channel != 'promote'
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      dry_run: ${{ steps.channel.outputs.dry_run }}
      # Set only by the nightly gate: 'true' for a scheduled nightly with
      # nothing new on main, 'false' for a nightly that is due or resumed.
      # Every later job is gated on it, so a skipped run publishes nothing and
      # ends green.
      skip: ${{ steps.gate.outputs.skip }}
      previous_nightly: ${{ steps.gate.outputs.previous }}
      tag: ${{ steps.tag.outputs.tag || steps.nightly.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
      release_flags: ${{ steps.plan.outputs.release_flags }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      # 'true' on the release channel alone: the npm job then moves npm
      # `latest` up to this version.
      move_latest: ${{ steps.plan.outputs.move_latest }}
      # 'true' unless the run skipped or is a dry run; the release, npm and
      # deploy jobs run only then.
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Select the channel
        id: channel
        env:
          EVENT: ${{ github.event_name }}
          CHANNEL_INPUT: ${{ inputs.channel }}
          TAG_INPUT: ${{ inputs.tag }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          channel=release
          if [ "$EVENT" = schedule ]; then
            channel=nightly
          elif [ "$EVENT" = workflow_dispatch ]; then
            channel="${CHANNEL_INPUT:-release}"
          fi
          dry_run=false
          if [ "$EVENT" = workflow_dispatch ] && [ "$DRY_RUN_INPUT" = true ]; then
            dry_run=true
          fi
          case "$channel" in
            release)
              if [ "$EVENT" = workflow_dispatch ] && [ -z "$TAG_INPUT" ]; then
                echo "a release dispatch needs the tag input" >&2
                exit 1
              fi
              ;;
            nightly)
              if [ -n "$TAG_INPUT" ]; then
                echo "a nightly computes its own tag; leave the tag input empty" >&2
                exit 1
              fi
              # Scheduled runs always build the default branch. A dispatched
              # nightly that publishes must build main too; a dry run may
              # build any branch.
              if [ "$EVENT" = workflow_dispatch ] && [ "$dry_run" != true ] &&
                [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "a publishing nightly must be dispatched from main, not $GITHUB_REF; set dry_run to build a branch" >&2
                exit 1
              fi
              ;;
            *)
              echo "unknown channel: $channel" >&2
              exit 1
              ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
      # t3code's shouldReleaseNightly without its six-hour gap: the cron already
      # spaces scheduled runs six hours apart. The previous nightly's tag is also
      # what the release notes compare against.
      #
      # Resume rule: a nightly tag ends in .<run_number>, which every attempt
      # of a run shares. A later attempt (run_attempt > 1) that finds a
      # published nightly ending in its own .<run_number>, whose tag is at this
      # run's commit, resumes it, with resume=<that tag>: it skips the
      # new-commits check, which would see the nightly at this very commit and
      # skip, and reuses the tag's version, because the UTC date in it may have
      # changed since. A suffix match at another commit is a leftover from
      # before a run-number reset and is ignored. With no match, the attempt
      # runs like the first.
      - name: Look for commits since the last nightly
        id: gate
        if: steps.channel.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Newest published (non-draft) release whose tag contains -nightly.
          # The API lists newest first, so the first 100 hold it unless 100
          # releases followed it; then this run simply publishes again.
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select((.draft | not) and (.tag_name | contains("-nightly.")))]
                  | max_by(.published_at) | .tag_name // ""')
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          resume=""
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            candidates=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select((.draft | not) and (.tag_name | contains("-nightly."))
                      and (.tag_name | endswith(".\(env.GITHUB_RUN_NUMBER)"))) | .tag_name')
            for candidate in $candidates; do
              tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$candidate" --jq .sha)
              if [ "$tagged" = "$SHA" ]; then
                resume=$candidate
                break
              fi
              echo "not resuming $candidate: its tag is at $tagged, not this run's commit $SHA"
            done
          fi
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
          skip=false
          if [ -n "$resume" ]; then
            echo "attempt $GITHUB_RUN_ATTEMPT resumes $resume from an earlier attempt of run $GITHUB_RUN_NUMBER"
          elif [ -z "$previous" ]; then
            echo "no earlier nightly release; this run publishes the first"
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$SHA" --jq .ahead_by)
            if ! [[ "$ahead" =~ ^[0-9]+$ ]]; then
              echo "could not compare $previous with $SHA" >&2
              exit 1
            elif [ "$ahead" -eq 0 ]; then
              skip=true
              echo "main has no commits after $previous; skipping this nightly"
            else
              echo "main has $ahead commit(s) after $previous"
            fi
          else
            echo "dispatched nightly; not checking for commits after $previous"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - name: Select release tag
        id: tag
        if: steps.channel.outputs.channel == 'release'
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-$REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "invalid release tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          persist-credentials: false
          # A release builds its verified tag; a nightly builds the commit this
          # run started on.
          ref:
            ${{ steps.channel.outputs.channel == 'nightly' && github.sha ||
            format('refs/tags/{0}', steps.tag.outputs.tag) }}
          fetch-depth: 0
      - name: Install proto toolchain
        if: steps.gate.outputs.skip != 'true'
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095
        with:
          auto-install: true
      # skip is 'false' only on a nightly that is due: the gate runs for
      # nightlies alone. A resumed nightly keeps its tag's version.
      - name: Compute and apply the nightly version
        id: nightly
        if: steps.gate.outputs.skip == 'false'
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RESUME: ${{ steps.gate.outputs.resume }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RESUME" ]; then
            version="${RESUME#v}"
          else
            base=$(bun -p "require('./packages/cli/package.json').version")
            version=$(bun packages/cli/scripts/nightly-version.ts --base "$base" \
              --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --run "$RUN_NUMBER")
          fi
          bun packages/cli/scripts/set-release-version.ts "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Verify release metadata
        id: metadata
        if: steps.gate.outputs.skip != 'true'
        env:
          THADDEUS_RELEASE_TAG:
            ${{ steps.tag.outputs.tag || steps.nightly.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          moon run root:version-check
          version=$(bun -p "require('./packages/cli/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The release and npm jobs publish with these outputs and nothing else,
      # so the guard below checks exactly what they will do.
      - name: Plan the publication
        id: plan
        if: steps.gate.outputs.skip != 'true'
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          DRY_RUN: ${{ steps.channel.outputs.dry_run }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # A prerelease version (e.g. 0.1.0-alpha) must not become npm's
          # default `latest` dist-tag; it publishes under a tag named after its
          # prerelease id (alpha/beta/rc/nightly/…), else `next`. A stable
          # version (no `-`) publishes to `latest`.
          case "$VERSION" in
            *-*)
              npm_tag="${VERSION#*-}"
              npm_tag="${npm_tag%%.*}"
              npm_tag="$(printf '%s' "$npm_tag" | tr -d '0-9')"
              [ -n "$npm_tag" ] || npm_tag="next"
              ;;
            *) npm_tag=latest ;;
          esac
          # A nightly is a prerelease and never GitHub's "latest" release, so
          # install.sh's default (releases/latest) keeps resolving to a release.
          release_flags=""
          if [ "$CHANNEL" = nightly ]; then
            release_flags="--prerelease --latest=false"
          fi
          # An alpha publishes to `alpha`, so a bare `npm i @thaddeus.run/cli`
          # would keep resolving to an old `latest`. Releases move it up;
          # nightlies never touch it.
          move_latest=false
          if [ "$CHANNEL" = release ]; then move_latest=true; fi
          publish=true
          if [ "$DRY_RUN" = true ]; then publish=false; fi
          echo "npm_tag=$npm_tag" >> "$GITHUB_OUTPUT"
          echo "release_flags=$release_flags" >> "$GITHUB_OUTPUT"
          echo "move_latest=$move_latest" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Guard the nightly publication
        if: steps.gate.outputs.skip == 'false'
        env:
          TAG: ${{ steps.nightly.outputs.tag }}
          RELEASE_FLAGS: ${{ steps.plan.outputs.release_flags }}
          NPM_TAG: ${{ steps.plan.outputs.npm_tag }}
          MOVE_LATEST: ${{ steps.plan.outputs.move_latest }}
        shell: bash
        run: |
          set -euo pipefail
          refuse() {
            echo "refusing nightly $TAG: $*" >&2
            exit 1
          }
          case "$TAG" in v*-nightly.*) ;; *) refuse "its tag lacks -nightly." ;; esac
          case " $RELEASE_FLAGS " in
            *" --prerelease "*) ;;
            *) refuse "the GitHub release would not be a prerelease" ;;
          esac
          case " $RELEASE_FLAGS " in
            *" --latest=false "*) ;;
            *) refuse "the GitHub release could become latest" ;;
          esac
          if [ "$NPM_TAG" != nightly ]; then
            refuse "npm would publish to dist-tag '$NPM_TAG', not nightly"
          fi
          if [ "$MOVE_LATEST" != false ]; then
            refuse "the npm job would move dist-tag latest"
          fi
          echo "$TAG publishes as a prerelease, never latest, to npm dist-tag nightly, and leaves npm latest alone"

  cli:
    name: Build CLI binaries
    needs: [preflight]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
      - name: Install proto toolchain
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          auto-install: true
      # Before the install, so bun.lock and the manifests agree on the version.
      - name: Apply the nightly version
        if: needs.preflight.outputs.channel == 'nightly'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: bun packages/cli/scripts/set-release-version.ts "$VERSION"
      - name: Install dependencies
        run: |
          sed -i 's/^minimumReleaseAge = .*/minimumReleaseAge = 0/' bunfig.toml
          bun install --frozen-lockfile
      - name: Build the CLI dependency chain
        run: moon run cli:build
      - name: Cross-compile every target
        run: |
          mkdir -p dist-bins
          # bun cross-compiles all of these from this one Linux runner.
          targets="bun-linux-x64:linux-x64 bun-linux-arm64:linux-arm64 \
                   bun-darwin-x64:darwin-x64 bun-darwin-arm64:darwin-arm64 \
                   bun-windows-x64:windows-x64"
          for pair in $targets; do
            target="${pair%%:*}"; name="${pair##*:}"; out="dist-bins/thaddeus-$name"
            case "$name" in *windows*) out="$out.exe";; esac
            echo "→ $target"
            bun build --compile --minify --target="$target" --outfile "$out" packages/cli/src/bin.ts
          done
          ls -la dist-bins
      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist-bins/*

  tui:
    name: Build TUI (${{ matrix.name }})
    needs: [preflight]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Native builds only (ring/TLS cross-compilation is a known pain); the
        # CLI already covers linux-arm64. Adding a lazythad-linux-arm64 build is a
        # follow-up.
        include:
          - {
              os: ubuntu-latest,
              target: x86_64-unknown-linux-gnu,
              name: linux-x64,
            }
          # Both macOS slices build on the arm64 runner — macOS cross-compiles
          # x86_64-apple-darwin natively, so we avoid the scarce macos-13 Intel
          # runners (which can queue for tens of minutes and stall the release).
          - { os: macos-14, target: aarch64-apple-darwin, name: darwin-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, name: darwin-x64 }
          - {
              os: windows-latest,
              target: x86_64-pc-windows-msvc,
              name: windows-x64,
            }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      # lazythad's --version comes from Cargo.toml, and --locked needs
      # Cargo.lock to match it, so a nightly rewrites both with the same script
      # as the CLI job. Only proto and its pinned bun are installed; Rust comes
      # from the step below as for any release.
      - name: Install proto
        if: needs.preflight.outputs.channel == 'nightly'
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          cache: false
      - name: Apply the nightly version
        if: needs.preflight.outputs.channel == 'nightly'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          proto install bun
          bun packages/cli/scripts/set-release-version.ts "$VERSION"
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: lazythad
      - name: Build
        shell: bash
        run:
          cargo build --release --locked --manifest-path lazythad/Cargo.toml
          --target ${{ matrix.target }}
      - name: Stage the binary
        shell: bash
        run: |
          mkdir -p dist-bins
          ext=""; case "${{ matrix.name }}" in *windows*) ext=".exe";; esac
          cp "lazythad/target/${{ matrix.target }}/release/lazythad$ext" "dist-bins/lazythad-${{ matrix.name }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: tui-${{ matrix.name }}
          path: dist-bins/*

  verify-artifacts:
    name: Verify binary versions (${{ matrix.os }})
    needs: [preflight, cli, tui]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              os: ubuntu-24.04,
              cli: thaddeus-linux-x64,
              tui: lazythad-linux-x64,
              tuiArtifact: tui-linux-x64,
            }
          - {
              os: ubuntu-24.04-arm,
              cli: thaddeus-linux-arm64,
              tui: '',
              tuiArtifact: '',
            }
          - {
              os: macos-14,
              cli: thaddeus-darwin-arm64,
              tui: lazythad-darwin-arm64,
              tuiArtifact: tui-darwin-arm64,
            }
          - {
              os: macos-15-intel,
              cli: thaddeus-darwin-x64,
              tui: lazythad-darwin-x64,
              tuiArtifact: tui-darwin-x64,
            }
          - {
              os: windows-latest,
              cli: thaddeus-windows-x64.exe,
              tui: lazythad-windows-x64.exe,
              tuiArtifact: tui-windows-x64,
            }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: artifacts/cli
      - uses: actions/download-artifact@v4
        if: matrix.tuiArtifact != ''
        with:
          name: ${{ matrix.tuiArtifact }}
          path: artifacts/tui
      - name: Run the downloaded binaries
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          CLI_BINARY: ${{ matrix.cli }}
          TUI_BINARY: ${{ matrix.tui }}
        shell: bash
        run: |
          set -euo pipefail
          check_binary() {
            local binary_path="$1"
            if [ "$RUNNER_OS" != "Windows" ]; then chmod +x "$binary_path"; fi
            local actual_version
            actual_version=$("$binary_path" --version)
            if [ "$actual_version" != "$EXPECTED_VERSION" ]; then
              echo "$binary_path reports $actual_version; expected $EXPECTED_VERSION" >&2
              return 1
            fi
          }
          check_binary "artifacts/cli/$CLI_BINARY"
          if [ -n "$TUI_BINARY" ]; then check_binary "artifacts/tui/$TUI_BINARY"; fi

  release:
    name: Publish GitHub Release
    needs: [preflight, verify-artifacts]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries and checksums
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ( cd release && sha256sum * > SHA256SUMS )
          ls -la release
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          CHANNEL: ${{ needs.preflight.outputs.channel }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SHA: ${{ needs.preflight.outputs.sha }}
          PREVIOUS_NIGHTLY: ${{ needs.preflight.outputs.previous_nightly }}
          RELEASE_FLAGS: ${{ needs.preflight.outputs.release_flags }}
          NPM_TAG: ${{ needs.preflight.outputs.npm_tag }}
        run: |
          NOTES="Prebuilt \`thaddeus\` (CLI) and \`lazythad\` (TUI) binaries.

          Install both with PATH set up:
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh
          \`\`\`
          Or via npm: \`npm i -g @thaddeus.run/cli@${NPM_TAG} @thaddeus.run/lazythad@${NPM_TAG}\`.

          Point it at a server with \`thaddeus use\`: \`--hosted\` for the official https://ams1.thaddeus.run, or \`thaddeus use <your-server>\` for your own. See CHANGELOG.md for changes."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          elif [ "$CHANNEL" = nightly ]; then
            short_sha="${SHA:0:7}"
            NOTES="> [!WARNING]
          > This nightly is an untested build of \`main\` at ${short_sha} and may be broken."
            if [ -n "$PREVIOUS_NIGHTLY" ]; then
              NOTES="$NOTES

          Changes since ${PREVIOUS_NIGHTLY}: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_NIGHTLY}...${TAG}"
            fi
            # The tag does not exist yet; --target creates it at the built
            # commit. RELEASE_FLAGS is split on purpose: the preflight guard
            # checked it holds --prerelease and --latest=false.
            # shellcheck disable=SC2086
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" $RELEASE_FLAGS \
              --title "Thaddeus nightly $VERSION ($short_sha)" --notes "$NOTES"
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
              --title "Thaddeus $TAG" --notes "$NOTES" --verify-tag
          fi

  npm:
    name: Publish npm launchers
    needs: [preflight, release]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC identity for npm Trusted Publishing — no NPM_TOKEN secret needed;
      # npm authenticates via this token and emits a provenance attestation.
      # Requires each package to have a Trusted Publisher configured on
      # npmjs.com pointing at this repo + workflow (release.yml).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      # The launchers must carry the nightly version they download. proto
      # (without a cache, so no proto-managed node or npm lands on PATH) only
      # supplies bun here, before setup-node.
      - name: Install proto
        if: needs.preflight.outputs.channel == 'nightly'
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0
        with:
          cache: false
      - name: Apply the nightly version
        if: needs.preflight.outputs.channel == 'nightly'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          proto install bun
          bun packages/cli/scripts/set-release-version.ts "$VERSION"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm >= 11.5.1, and moving a dist-tag
      # over OIDC needs >= 11.21.0. PINNED, not @latest: an npm@latest install
      # on the runner shipped without its `sigstore` module, so `npm publish
      # --provenance` died with MODULE_NOT_FOUND (v0.1.2-alpha's first publish
      # run). Verify the install is the pin and can actually load provenance
      # support, and the semver module that orders versions for `latest`,
      # before publishing, so a broken npm fails THIS step, loudly. npm-promote
      # repeats this step.
      - name: Update npm (pinned)
        run: |
          npm install -g npm@11.21.1
          actual=$(npm --version)
          echo "npm $actual"
          [ "$actual" = 11.21.1 ] || { echo "npm on PATH is $actual, not the pinned 11.21.1"; exit 1; }
          node -e "require(process.argv[1])" \
            "$(npm root -g)/npm/node_modules/libnpmpublish/lib/provenance.js" \
            || { echo "npm install is missing provenance support (sigstore)"; exit 1; }
          node -e "require(process.argv[1])" "$(npm root -g)/npm/node_modules/semver" \
            || { echo "npm install is missing its semver module"; exit 1; }
      - name: Publish thaddeus + lazythad launchers
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          # Derived from the version in preflight (alpha, nightly, latest, …)
          # and checked there by the nightly guard.
          NPM_TAG: ${{ needs.preflight.outputs.npm_tag }}
        run: |
          set -euo pipefail
          version="$EXPECTED_VERSION"
          # Idempotent per package: a re-run after a partial failure must skip
          # what already published (npm forbids publishing over a version), and
          # the OIDC identity-token exchange is occasionally flaky on the 2nd
          # publish in a job (IDENTITY_TOKEN_READ_ERROR) — so retry each one.
          for pkg in thaddeus lazythad; do
            (
              cd "npm/$pkg"
              name="$(node -p "require('./package.json').name")"
              actual_version=$(node -p "require('./package.json').version")
              if [ "$actual_version" != "$version" ]; then
                echo "launcher version $actual_version differs from $version" >&2
                exit 1
              fi
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "$name@$version already on the registry — skipping"
                exit 0
              fi
              for attempt in 1 2 3; do
                if npm publish --provenance --access public --tag "$NPM_TAG"; then
                  exit 0
                fi
                if [ "$attempt" -lt 3 ]; then
                  echo "publish attempt $attempt for $name failed; retrying in 15s" >&2
                  sleep 15
                fi
              done
              echo "giving up on $name after 3 attempts" >&2
              exit 1
            )
          done
      # Runs once both launchers are on the registry, whether the step above
      # published them or found them there. It only moves `latest` forward, so
      # re-running an older tag leaves a newer `latest` alone. bun is installed
      # here for nightlies only, so the pinned npm's own semver package orders
      # the versions, as Bun.semver.order would. Moving a dist-tag over OIDC
      # needs "Allow npm dist-tag" in each package's trusted-publisher settings
      # on npmjs.com; without it this step fails after the publish, and what
      # was published stays published.
      - name: Move npm latest up to this release
        if: needs.preflight.outputs.move_latest == 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          semver="$(npm root -g)/npm/node_modules/semver"
          # Prints 1, 0 or -1 as $1 sorts after, with or before $2.
          order() {
            node -p 'require(process.argv[1]).compare(process.argv[2], process.argv[3])' \
              "$semver" "$1" "$2"
          }
          failed=false
          for pkg in thaddeus lazythad; do
            name="$(node -p "require('./npm/$pkg/package.json').name")"
            current="$(npm view "$name" dist-tags.latest)"
            if [ -n "$current" ]; then
              cmp=$(order "$VERSION" "$current")
              if [ "$cmp" -lt 0 ]; then
                echo "$name: latest is $current, newer than $VERSION; leaving it"
                continue
              elif [ "$cmp" -eq 0 ]; then
                echo "$name: latest is already $VERSION"
                continue
              fi
            fi
            # Retried for the same flaky OIDC token exchange as publish.
            moved=false
            for attempt in 1 2 3; do
              if npm dist-tag add "$name@$VERSION" latest; then
                moved=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "dist-tag attempt $attempt for $name failed; retrying in 15s" >&2
                sleep 15
              fi
            done
            if [ "$moved" = true ]; then
              echo "$name: latest moved from ${current:-nothing} to $VERSION"
            else
              echo "npm refused to move latest; enable \"Allow npm dist-tag\" in the trusted publisher settings of $name on npmjs.com, then run the promote dispatch" >&2
              failed=true
            fi
          done
          [ "$failed" = false ]

  # channel=promote points npm `latest` at an existing release without
  # building anything, for example once "Allow npm dist-tag" is enabled or to
  # roll `latest` back. It needs no other job and preflight skips itself on a
  # promote, so this is the only job that runs.
  npm-promote:
    name: Point npm latest at an existing release
    if: inputs.channel == 'promote'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC identity for moving the dist-tags, as in the npm job.
      id-token: write
    steps:
      - name: Check the tag and its GitHub release
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          refuse() {
            echo "refusing to promote '$TAG': $*" >&2
            exit 1
          }
          [ -n "$TAG" ] || refuse "a promote dispatch needs the tag input"
          # v<semver> as semver.org defines it, minus build metadata, which an
          # npm version never carries.
          num='(0|[1-9][0-9]*)'
          id='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          re="^v$num\\.$num\\.$num(-$id(\\.$id)*)?\$"
          [[ "$TAG" =~ $re ]] || refuse "it is not v<semver>"
          case "$TAG" in *-nightly*) refuse "a nightly never becomes npm latest" ;; esac
          if ! state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '"\(.isDraft) \(.isPrerelease)"'); then
            refuse "it has no GitHub release"
          fi
          case "$state" in
            "false false") ;;
            "true "*) refuse "its GitHub release is a draft" ;;
            "false true") refuse "its GitHub release is a prerelease" ;;
            *) refuse "unexpected GitHub release state: $state" ;;
          esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # The npm job's step: OIDC dist-tag moves need npm >= 11.21.0.
      - name: Update npm (pinned)
        run: |
          npm install -g npm@11.21.1
          actual=$(npm --version)
          echo "npm $actual"
          [ "$actual" = 11.21.1 ] || { echo "npm on PATH is $actual, not the pinned 11.21.1"; exit 1; }
          node -e "require(process.argv[1])" \
            "$(npm root -g)/npm/node_modules/libnpmpublish/lib/provenance.js" \
            || { echo "npm install is missing provenance support (sigstore)"; exit 1; }
          node -e "require(process.argv[1])" "$(npm root -g)/npm/node_modules/semver" \
            || { echo "npm install is missing its semver module"; exit 1; }
      # Both launchers must have the version before either tag moves, so a
      # promote never leaves them on different releases. This explicit request
      # may move `latest` backwards, and says so when it does.
      - name: Point npm latest at the release
        env:
          VERSION: ${{ steps.target.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          # The names in npm/thaddeus and npm/lazythad package.json.
          LAUNCHERS: '@thaddeus.run/cli @thaddeus.run/lazythad'
        shell: bash
        run: |
          set -euo pipefail
          for name in $LAUNCHERS; do
            published=$(npm view "$name@$VERSION" version 2>/dev/null) || published=""
            if [ "$published" != "$VERSION" ]; then
              echo "refusing to promote $VERSION: $name@$VERSION is not on npm" >&2
              exit 1
            fi
          done
          semver="$(npm root -g)/npm/node_modules/semver"
          # Prints 1, 0 or -1 as $1 sorts after, with or before $2.
          order() {
            node -p 'require(process.argv[1]).compare(process.argv[2], process.argv[3])' \
              "$semver" "$1" "$2"
          }
          failed=false
          for name in $LAUNCHERS; do
            current="$(npm view "$name" dist-tags.latest)"
            cmp=1
            if [ -n "$current" ]; then cmp=$(order "$VERSION" "$current"); fi
            if [ "$cmp" -eq 0 ]; then
              echo "$name: latest is already $VERSION"
              continue
            elif [ "$cmp" -lt 0 ]; then
              echo "$name: moving latest backwards from $current to $VERSION, as requested"
            fi
            if [ "$DRY_RUN" = true ]; then
              echo "$name: dry run; would move latest from ${current:-nothing} to $VERSION"
              continue
            fi
            moved=false
            for attempt in 1 2 3; do
              if npm dist-tag add "$name@$VERSION" latest; then
                moved=true
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "dist-tag attempt $attempt for $name failed; retrying in 15s" >&2
                sleep 15
              fi
            done
            if [ "$moved" = true ]; then
              echo "$name: latest moved from ${current:-nothing} to $VERSION"
            else
              echo "npm refused to move latest; enable \"Allow npm dist-tag\" in the trusted publisher settings of $name on npmjs.com, then run the promote dispatch" >&2
              failed=true
            fi
          done
          [ "$failed" = false ]

  # Deploys ams1 (https://ams1.thaddeus.run) from the commit every other job
  # built. Fly's GitHub auto-deploy is off, so this is the only automatic
  # deploy. It runs for a publishing release-channel tag push alone: the
  # production environment that holds FLY_API_TOKEN admits only v* tag refs,
  # and a dispatched release runs on a branch ref (usually main), which the
  # environment would refuse. Nightlies and dry runs never deploy.
  deploy:
    name: Deploy ams1
    needs: [preflight, release]
    if:
      needs.preflight.outputs.channel == 'release' &&
      needs.preflight.outputs.publish == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    # Deploys run one at a time and a running one is never cancelled. GitHub
    # keeps only the newest pending deploy, so a burst of tags deploys the last.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # A missing or rejected token fails here, before anything deploys, with a
      # message that says where the token lives.
      - name: Check the Fly deploy token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not set in the production environment" >&2
            exit 1
          fi
          if ! flyctl status --app thaddeus; then
            echo "FLY_API_TOKEN in the production environment was rejected by Fly" >&2
            exit 1
          fi
      # fly.toml at the repo root names the app, volume and health check.
      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --app thaddeus
      # flyctl waits for the health check, which only proves the server
      # answers. The new machine is serving once /version reports this
      # release. 19 tries 10 s apart span three minutes.
      - name: Wait for ams1 to report the release version
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          VERSION_URL: https://ams1.thaddeus.run/version
        shell: bash
        run: |
          set -euo pipefail
          last=""
          for attempt in $(seq 1 19); do
            last=$(curl -sS --max-time 10 "$VERSION_URL" 2>&1) || true
            actual=$(jq -r '.version // empty' <<<"$last" 2>/dev/null) || actual=""
            if [ "$actual" = "$EXPECTED_VERSION" ]; then
              echo "ams1 reports $actual after $attempt attempt(s)"
              exit 0
            fi
            if [ "$attempt" -lt 19 ]; then sleep 10; fi
          done
          echo "ams1 did not report $EXPECTED_VERSION within 3 minutes; last response from $VERSION_URL: $last" >&2
          exit 1
