# Adapted from pingdotgg/t3code at 2fae0f9.
name: Bug report
description:
  Report broken behavior, regressions, crashes, or reliability issues.
title: '[Bug]: '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for broken behavior, regressions, crashes, or reliability problems.
        Feature requests belong in [Discussions](https://github.com/thaddeus-run/thaddeus/discussions/categories/ideas).
        Report security vulnerabilities privately through [GitHub advisories](https://github.com/thaddeus-run/thaddeus/security/advisories/new), not here.
        Search existing issues first and keep the report focused on one problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label:
            I included enough detail to reproduce or investigate the problem.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - CLI (`thaddeus` / `thad`)
        - Self-hosted server (`thaddeus serve`)
        - Hosted server (`ams1.thaddeus.run`)
        - lazythad TUI
        - Client or SDK packages
        - Install, release or npm
        - Docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal, deterministic repro.
      placeholder: |
        1. Run `thaddeus serve` with a fresh data directory
        2. Create an identity and publish a change
        3. Stop the server and start it again on the same data directory
        4. Read the change back
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder:
        The change is still there and reads back with its signed explanation.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: The read fails with a 404 and the log shows no entries.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How bad is this in practice?
      options:
        - Blocks work completely
        - Major degradation or frequent failure
        - Minor bug or occasional failure
        - Cosmetic issue
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `thaddeus --version`.
      placeholder: 0.1.10-alpha
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: Server
      description:
        If a server is involved, give its URL and the output of `curl
        <server>/version`.
      placeholder:
        https://ams1.thaddeus.run, {"version":"0.1.10-alpha","protocol":1}

  - type: input
    id: environment
    attributes:
      label: Environment
      description:
        OS, CPU architecture, install method (install script, npm, release
        binary, or source), and Bun version if you built from source.
      placeholder: Ubuntu 24.04 x86_64, installed with the install script

  - type: textarea
    id: logs
    attributes:
      label: Logs or stack traces
      description:
        Paste the most relevant output only. Redact secrets and never paste an
        identity seed.
      render: shell

  - type: upload
    id: attachments
    attributes:
      label: Screenshots, recordings, or supporting files
      description:
        Upload screenshots, short recordings, repro archives, or log files.
        Redact secrets before uploading.
    validations:
      required: false
      accept: '.png,.jpg,.jpeg,.gif,.webp,.svg,.mp4,.mov,.webm,.log,.txt,.json,.zip'

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: If you found a temporary workaround, include it.
      placeholder:
        Starting the server with a new data directory avoids the failure.
