# Adapted from pingdotgg/t3code at 2fae0f9.
name: Triage report
description:
  Filed with `thaddeus triage`, where a coding agent investigated the machine.
  For hand-written reports use the bug report template instead.
labels:
  - via-triage
body:
  - type: markdown
    attributes:
      value: |
        This structure is what `thaddeus triage` agents follow. Keep one problem per issue
        and redact secrets, identity seeds and home directory paths from anything you paste.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The problem in the user's own words.
    validations:
      required: true

  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnosis
      description: What the investigation found, grounded in output and source.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal, deterministic repro if one was found.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description:
        Version of Thaddeus the problem happened on (not the `thaddeus triage`
        CLI version), or unknown.
      placeholder: 0.1.10-alpha
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: Server
      description:
        If a server is involved, give its URL and what `curl <server>/version`
        answered.
      placeholder:
        https://ams1.thaddeus.run, {"version":"0.1.10-alpha","protocol":1}

  - type: input
    id: environment
    attributes:
      label: Environment
      description:
        OS, CPU architecture, install method (install script, npm, release
        binary, or source), agent CLI versions if relevant.
      placeholder: Ubuntu 24.04 x86_64, install script, claude 2.1.0
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description:
        The most relevant command output, server responses, or stack traces
        only. Redacted.
      render: shell

  - type: input
    id: related
    attributes:
      label: Related issues
      description:
        Existing issues that look similar, and why this is not a duplicate.

  - type: textarea
    id: workaround
    attributes:
      label: Fix applied or workaround
      description: Anything that was run on the machine to unblock the user.

  - type: input
    id: agent
    attributes:
      label: Filed by
      description: Which agent and model produced this report.
      placeholder: claude (opus-5) via thaddeus triage
