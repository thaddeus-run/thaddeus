$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'example-cli'
language: 'typescript'
layer: 'application'

tasks:
  test:
    deps:
      - 'cli:compile'
    options:
      cache: false
      # Match cli:compile; the CI workflow clears CI explicitly to run both.
      runInCI: 'skip'
  agent-demo:
    command: 'bun src/agent-governed-demo.ts'
    deps:
      - 'cli:compile'
    options:
      cache: false
      runInCI: 'skip'
  demo:
    command: 'bun src/cli-demo.ts'
    deps:
      - '^:build'
    options:
      cache: false
      runInCI: 'skip'
  grant-demo:
    command: 'bun src/grant-demo.ts'
    deps:
      - '^:build'
    options:
      cache: false
      runInCI: 'skip'
