$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Fail fast when a developer's proto-installed moon drifts from the repo pin
# in .prototools; both must move together.
versionConstraint: '2.3.3'

projects:
  globs:
    - 'packages/*'
    - 'apps/*'
    # ee/ holds ThadHub projects plus its own LICENSE and README at the top
    # level; exclude those two files so moon only sees project directories.
    - 'ee/*'
    - '!ee/LICENSE'
    - '!ee/README.md'
    - 'examples/*'
    - 'integration'
  sources:
    # Repo-wide tooling (lint, format, clean) lives on the root project.
    root: '.'

vcs:
  client: 'git'
  defaultBranch: 'main'
  # moon generates .moon/hooks/* (gitignored) and points the worktree-local
  # core.hooksPath at it, so every clone gets hooks from any moon command
  # without an install-time side effect like husky's prepare.
  sync: true
  hooks:
    pre-commit:
      # GUI Git clients may not load the shell profile that adds proto to PATH.
      # Load its pinned tools here so hooks use the same toolchain as the CLI.
      - 'export
        PATH="${PROTO_HOME:-$HOME/.proto}/shims:${PROTO_HOME:-$HOME/.proto}/bin:$PATH"'
      # Typecheck the projects affected by staged files (and their dependents),
      # format the worktree, then run lint-staged (which re-stages fixes).
      - 'moon exec :typecheck --affected --status staged'
      - 'moon run root:format'
      - 'bun lint-staged'
